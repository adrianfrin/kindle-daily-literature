name: notify-grok
on:
  push:
    branches: [master]
    paths: ['articles/**']
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Forward push event
        env:
          URL: ${{ secrets.GROK_WEBHOOK_URL }}
          KEY: ${{ secrets.GROK_WEBHOOK_KEY }}
        run: |
          curl -sf -X POST "$URL" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            --data @"$GITHUB_EVENT_PATH"
